<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devgui</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top-bar">
  <span id="app-title">devgui</span>
  <span id="operator-status">操作権: 空き</span>
  <button id="operator-acquire-btn" type="button" hidden>操作権を取得</button>
  <button id="operator-request-btn" type="button" hidden>操作権を要求</button>
  <button id="operator-release-btn" type="button" hidden>操作権を解放</button>
  <span id="ws-status" class="ws-status ws-disconnected">切断</span>
</header>
<nav id="tab-bar"></nav>
<main id="panels"></main>
<div id="toast-container"></div>

<footer id="command-log-bar">
  <div id="command-log-header">コマンドログ</div>
  <div id="command-log" class="command-log"></div>
</footer>

<div id="takeover-incoming-dialog" class="modal-overlay" hidden>
  <div class="modal-box">
    <p id="takeover-incoming-message"></p>
    <p>残り <span id="takeover-incoming-countdown"></span> 秒</p>
    <div class="modal-actions">
      <button id="takeover-accept-btn" type="button">許可</button>
      <button id="takeover-reject-btn" type="button">拒否</button>
    </div>
  </div>
</div>

<div id="takeover-waiting-dialog" class="modal-overlay" hidden>
  <div class="modal-box">
    <p>操作権の要求を送信しました。相手の応答を待っています...</p>
    <p id="takeover-waiting-countdown-line">残り <span id="takeover-waiting-countdown"></span> 秒（応答がなければ自動で取得します）</p>
    <div class="modal-actions">
      <button id="takeover-cancel-btn" type="button">取り消し</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
